[package]
name = "cross-shelf"
version = "0.2.0"
description = "Steam, GOG and Epic libraries and wishlists in one place"
authors = ["Alex Adiaconitei"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cross_shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
regex = "1.13.1"
thiserror = "2.0.21"
log = "0.4.35"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "form"] }
unicode-normalization = "0.1.26"
webview2-com = "0.39.1"
ts-rs = "=12.0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3.27.0"
