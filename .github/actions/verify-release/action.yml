name: Verify release
description: >
  Resolves a release from a tag, refuses it unless every manifest carries the same version and
  CHANGELOG.md has a section for it, and writes that section to a notes file. Copied from
  devkit/actions (verify-release) because this repository is public and that one is private.

inputs:
  ref:
    description: Tag to verify, for example v1.2.0. Defaults to the pushed tag.
    required: false
    default: ''

outputs:
  version:
    description: Version without the leading v
    value: ${{ steps.verify.outputs.version }}
  tag:
    description: vX.Y.Z
    value: ${{ steps.verify.outputs.tag }}
  prerelease:
    description: "'true' when the version has a hyphen"
    value: ${{ steps.verify.outputs.prerelease }}
  notes_file:
    description: Path of the release notes taken from CHANGELOG.md
    value: ${{ steps.verify.outputs.notes_file }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        REF: ${{ inputs.ref || github.ref_name }}
      run: node "$GITHUB_ACTION_PATH/verify-version.mjs" "$REF"
