# Security-only: no routine version PRs, grouped security fixes, no automatic rebases.
# Keep the seven-day cooldown for version updates if they are enabled again (limit > 0).
# Security fixes bypass schedule/cooldown; pnpm may need a dated minimumReleaseAgeExclude.
# Delete the ecosystems the project does not use.
version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.PACKAGES_READ_TOKEN }} # classic PAT with read:packages

updates:
  - package-ecosystem: npm # pnpm projects use "npm" too
    directory: /
    registries: [github-packages]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
