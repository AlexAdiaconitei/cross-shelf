name: CI

# Node + pnpm: format, lint, types, tests and a production build, with integration tests against
# PostgreSQL when the project has `test:integration`. The jobs live in AlexAdiaconitei/actions
# (edited in devkit/actions); `devkit drift` proposes the new tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    permissions:
      contents: read
      packages: read # @alexadiaconitei/* from GitHub Packages
    uses: AlexAdiaconitei/actions/.github/workflows/ci-node.yml@v1.0.0
    with:
      integration: false
    secrets: inherit
