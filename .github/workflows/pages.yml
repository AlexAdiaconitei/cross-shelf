name: Landing (GitHub Pages)

# Only the landing: a change in the app or the backend never deploys it.
on:
  push:
    branches: [main]
    paths: ['gh-pages/**', '.github/workflows/pages.yml']
  # Redeploy by hand (gh workflow run pages.yml), e.g. after a history rewrite left gh-pages/ unchanged.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages workflow: deploy-pages looks the artifact up by name, and in
# one job it can run before the upload is listed ("No artifacts named github-pages were found").
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare the public site
        run: |
          mkdir -p "$RUNNER_TEMP/landing"
          cp gh-pages/index.html gh-pages/site.css gh-pages/site.js gh-pages/release.js "$RUNNER_TEMP/landing/"
          cp gh-pages/about.json gh-pages/about-card.js gh-pages/about-card.css gh-pages/alex.webp "$RUNNER_TEMP/landing/"
          cp -R gh-pages/assets gh-pages/i18n "$RUNNER_TEMP/landing/"
          touch "$RUNNER_TEMP/landing/.nojekyll"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
