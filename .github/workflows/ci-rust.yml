name: CI (Rust)

# Tauri backend: fmt, clippy and tests. Inlined from devkit/actions (ci-rust) because this
# repository is public and the shared workflows are private. Runs on Windows: the backend links
# the `windows` crate (DPAPI for secrets) and only builds there. No PostgreSQL: the app uses SQLite.

# Not for changes that cannot affect the backend: the landing, docs and other workflows.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'gh-pages/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ci-node.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore:
      - 'gh-pages/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ci-node.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # pin by SHA: pinact run
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2 # pin by SHA: pinact run
        with:
          workspaces: src-tauri
      # tauri::generate_context! embeds the built frontend, so the build folder must exist.
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build
        working-directory: .
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      # The TypeScript types of the IPC contract are generated from Rust (ts-rs, on cargo test).
      # A Rust change that is not followed by the regenerated files fails here.
      - run: git diff --exit-code -- ../src/lib/bindings
