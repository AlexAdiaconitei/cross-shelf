<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>CrossShelf</title>
		<!--
			Splash while WebView2 and the app load: plain HTML and CSS, painted before any script.
			The window starts in the same ink (tauri.conf.json backgroundColor), so there is no black
			or white flash. The root layout fades it out once the app has mounted.
		-->
		<style>
			html {
				background: #100f0d;
			}
			#splash {
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: grid;
				place-items: center;
				align-content: center;
				gap: 28px;
				background: #100f0d;
				transition: opacity 200ms ease-out;
			}
			#splash.out {
				opacity: 0;
				pointer-events: none;
			}
			#splash svg {
				width: 72px;
				height: 72px;
			}
			#splash .bar {
				position: relative;
				width: 120px;
				height: 3px;
				overflow: hidden;
				background: #2a2926;
			}
			#splash .bar::after {
				content: '';
				position: absolute;
				inset: 0 auto 0 0;
				width: 40%;
				background: #fbd530;
				animation: splash-run 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
			}
			@keyframes splash-run {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash .bar::after {
					animation: none;
					width: 100%;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" role="status" aria-label="Cargando CrossShelf">
			<!-- Brand kit: cross-shelf-small-on-dark.svg -->
			<svg viewBox="0 0 256 256" aria-hidden="true">
				<path
					fill="#F7F7F4"
					d="M48 16L16 16L16 48L16 144L16 176L16 240L48 240L48 176L176 176L176 144L48 144L48 48L176 48L176 16ZM208 208L80 208L80 240L208 240L240 240L240 208L240 112L240 80L240 76L208 44L208 80L80 80L80 112L208 112Z"
				/>
			</svg>
			<div class="bar"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
